<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Logout - Pothole Detection & Traffic Analysis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --primary: #00c896;
      --dark: #0d0d0d;
      --dark2: #141414;
      --dark3: #1a1a1a;
      --text: #e0e0e0;
      --text-muted: #888;
      --border: #2a2a2a;
      --red: #ff4d4d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Background glow circles */
    .circle1 {
      position: absolute; width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(0,200,150,0.08), transparent 70%);
      border-radius: 50%; left: -100px; bottom: -100px;
    }
    .circle2 {
      position: absolute; width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(0,200,150,0.06), transparent 70%);
      border-radius: 50%; right: 50px; bottom: 100px;
    }
    .circle3 {
      position: absolute; width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(0,200,150,0.05), transparent 70%);
      border-radius: 50%; right: 80px; top: 80px;
    }

    /* CARD */
    .logout-card {
      background: var(--dark3);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 52px 48px;
      width: 460px;
      text-align: center;
      position: relative;
      z-index: 1;
      box-shadow: 0 24px 60px rgba(0,0,0,0.4);
    }

    /* ICON */
    .logout-icon {
      width: 72px; height: 72px;
      background: rgba(255,77,77,0.1);
      border: 2px solid rgba(255,77,77,0.3);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
    }
    .logout-icon i { font-size: 28px; color: var(--red); }

    /* BRAND */
    .brand { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 28px; }
    .brand span { color: var(--primary); }

    /* TEXT */
    .logout-card h1 { font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 12px; }
    .logout-card p { font-size: 14px; color: var(--text-muted); line-height: 1.7; margin-bottom: 36px; }

    /* BUTTON */
    .btn-login {
      display: inline-flex; align-items: center; gap: 10px;
      background: var(--primary); color: #000;
      padding: 13px 32px; border-radius: 10px;
      font-size: 15px; font-weight: 600;
      text-decoration: none; transition: opacity .2s;
      font-family: 'Poppins', sans-serif;
    }
    .btn-login:hover { opacity: 0.85; }

    /* DIVIDER */
    .divider { border: none; border-top: 1px solid var(--border); margin: 28px 0; }

    .home-link { font-size: 13px; color: var(--text-muted); text-decoration: none; transition: color .2s; }
    .home-link:hover { color: var(--primary); }
  </style>
</head>
<body>

<div class="circle1"></div>
<div class="circle2"></div>
<div class="circle3"></div>

<div class="logout-card">

  <div class="logout-icon">
    <i class="fas fa-sign-out-alt"></i>
  </div>

  <h1>Logged Out Successfully</h1>
  <p>You have been successfully logged out.<br>
     Thank you for using Pothole Detection &amp; Traffic Analysis System.</p>

  <a href="/login" class="btn-login">
    <i class="fas fa-sign-in-alt"></i> Log In Again
  </a>

  <hr class="divider">

  <a href="/" class="home-link"><i class="fas fa-home" style="margin-right:6px;"></i>Back to Home</a>

</div>

</body>
</html>
